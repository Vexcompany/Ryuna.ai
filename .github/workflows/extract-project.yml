name: Extract Project ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file to extract (leave empty to use the first .zip found)"
        required: false
        type: string
      destination:
        description: "Extraction destination"
        required: false
        default: "."
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_INPUT="${{ inputs.zip_file }}"

          if [ -n "$ZIP_INPUT" ]; then
            [ -f "$ZIP_INPUT" ] || { echo "::error::ZIP file not found: $ZIP_INPUT"; exit 1; }
            ZIP_FILE="$ZIP_INPUT"
          else
            mapfile -t ZIPS < <(find . -type f -name "*.zip" -not -path "./.git/*" | sort)
            if [ "${#ZIPS[@]}" -eq 0 ]; then
              echo "::error::No ZIP file found in the repository."
              exit 1
            fi
            if [ "${#ZIPS[@]}" -gt 1 ]; then
              printf 'Multiple ZIP files found:\n%s\n' "${ZIPS[@]}"
              echo "::error::More than one ZIP exists. Specify zip_file."
              exit 1
            fi
            ZIP_FILE="${ZIPS[0]}"
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"
          DEST="${{ inputs.destination || '.' }}"

          mkdir -p "$DEST"

          # Extract into a temporary directory first so we can safely
          # unwrap archives that contain a single top-level folder such as
          # workspace/ without touching the repository's own .git.
          TMP_DIR="$RUNNER_TEMP/ryuna-extract"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          unzip -o "$ZIP_FILE" -d "$TMP_DIR"

          if [ "$DEST" = "." ]; then
            shopt -s dotglob nullglob
            ITEMS=("$TMP_DIR"/*)

            if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
              echo "Detected single wrapper directory: ${ITEMS[0]}"
              shopt -s dotglob
              mv "${ITEMS[0]}"/* "$DEST"/
            else
              mv "$TMP_DIR"/* "$DEST"/
            fi
          else
            shopt -s dotglob nullglob
            mv "$TMP_DIR"/* "$DEST"/
          fi

          # Never delete the repository's own .git directory.
          # Only remove .git directories created inside the extracted archive.
          if [ "$DEST" = "." ]; then
            find . -mindepth 2 -type d -name .git -prune -exec rm -rf {} +
          else
            find "$DEST" -mindepth 1 -type d -name .git -prune -exec rm -rf {} +
          fi

      - name: Remove source ZIP
        run: |
          rm -f "${{ steps.find_zip.outputs.zip_file }}"

      - name: Commit extracted project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "Git status:"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: extract project archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
